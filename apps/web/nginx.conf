# Раздача SPA и проксирование API на бэкенд той же compose-группы.
server {
    # 8080 вместо 80: контейнер работает под non-root, порты <1024 недоступны
    listen 8080;
    server_name _;

    # 50 MiB file contract + at most 1 MiB of multipart metadata. Spring still
    # enforces the exact per-file boundary and returns the canonical API error.
    client_max_body_size 51m;
    error_page 413 = @payload_too_large;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'report-sample'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'self' http: https: data: blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Gzip compression for text, scripts, styles and JSON API responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Проверка живости самого nginx — не зависит от бэкенда
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location @payload_too_large {
        internal;
        default_type application/problem+json;
        return 413 '{"type":"https://api.dwh.internal/errors/file_size_exceeded","title":"FILE_SIZE_EXCEEDED","status":413,"code":"file_size_exceeded","detail":"Размер файла превышает допустимые 50 МБ"}';
    }

    # API и поток событий — на бэкенд. Имя server резолвится в сети compose.
    location /api/ {
        # Встроенный DNS Docker + переменная в proxy_pass = резолвинг на каждый
        # запрос. Без этого nginx кэширует IP бэкенда со старта и после его
        # пересоздания (любое обновление версии) отдаёт 502, пока сам не будет
        # перезапущен.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_server server:8080;
        proxy_pass http://$upstream_server$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (FR-NOTIF-2): буферизация убила бы поток событий,
        # а короткий таймаут рвал бы соединение между heartbeat'ами.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # SPA-роутинг: любой неизвестный путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ассеты с хешем в имени можно кэшировать надолго
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
