name: ${PROJECT_NAME:-smartupcms}

x-server-common: &server-common
  image: ${SERVER_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/smartupcms}/server:${APP_VERSION:?APP_VERSION must be an immutable release tag}}
  restart: unless-stopped
  environment:
    DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-smartupcms}
    DB_USER: ${DB_USER:?DB_USER is required}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    APP_DWH_URL: jdbc:postgresql://postgres:5432/${DWH_DB_NAME:-smartupcms_dwh}
    APP_DWH_USERNAME: ${DB_USER:?DB_USER is required}
    APP_DWH_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    APP_DWH_CONNECT_TIMEOUT: ${APP_DWH_CONNECT_TIMEOUT:-5s}
    DWH_INSTANCE_CLIENT_CODE: ${ORGANIZATION_CODE:-default}
    DWH_INSTANCE_CLIENT_NAME: ${ORGANIZATION_NAME:?ORGANIZATION_NAME is required}
    DWH_INSTANCE_RESOURCE_PROFILE: ${RESOURCE_PROFILE:-S}
    DWH_INSTANCE_ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
    DWH_INSTANCE_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    DWH_INSTANCE_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    DWH_PROVIDER_STORAGE: ${DWH_PROVIDER_STORAGE:-local_disk}
    DWH_STORAGE_LOCAL_PATH: /var/lib/smartupcms/storage
    DWH_BACKUP_STATUS_FILE: /var/lib/smartupcms/backup/status.json
    DWH_SYSTEM_HEALTH_TIMEOUT: ${DWH_SYSTEM_HEALTH_TIMEOUT:-2s}
    DWH_BACKUP_MAX_AGE: ${DWH_BACKUP_MAX_AGE:-0s}
    DWH_WEBHOOKS_ENABLED: ${DWH_WEBHOOKS_ENABLED:-false}
    DWH_WEBHOOKS_ALLOWED_HOSTS: ${DWH_WEBHOOKS_ALLOWED_HOSTS:-}
    DWH_WEBHOOKS_ALLOW_PRIVATE_ADDRESSES: ${DWH_WEBHOOKS_ALLOW_PRIVATE_ADDRESSES:-false}
    DWH_WEBHOOKS_CONNECT_TIMEOUT: ${DWH_WEBHOOKS_CONNECT_TIMEOUT:-3s}
    DWH_WEBHOOKS_READ_TIMEOUT: ${DWH_WEBHOOKS_READ_TIMEOUT:-10s}
    DWH_S3_ENDPOINT: ${DWH_S3_ENDPOINT:-}
    DWH_S3_REGION: ${DWH_S3_REGION:-auto}
    DWH_S3_ACCESS_KEY: ${DWH_S3_ACCESS_KEY:-}
    DWH_S3_SECRET_KEY: ${DWH_S3_SECRET_KEY:-}
    DWH_S3_BUCKET: ${DWH_S3_BUCKET:-}
    DWH_S3_PATH_STYLE: ${DWH_S3_PATH_STYLE:-true}
    # Production file uploads are fail-closed. Development Compose remains
    # optional, but the supported production topology cannot disable scanning.
    DWH_FILE_SCANNER_REQUIRED: "true"
    DWH_FILE_SCANNER_CLAMAV_ENABLED: "true"
    DWH_FILE_SCANNER_CLAMAV_HOST: ${DWH_FILE_SCANNER_CLAMAV_HOST:-clamav}
    DWH_FILE_SCANNER_CLAMAV_PORT: ${DWH_FILE_SCANNER_CLAMAV_PORT:-3310}
    DWH_FILE_SCANNER_CLAMAV_CONNECT_TIMEOUT: ${DWH_FILE_SCANNER_CLAMAV_CONNECT_TIMEOUT:-3s}
    DWH_FILE_SCANNER_CLAMAV_READ_TIMEOUT: ${DWH_FILE_SCANNER_CLAMAV_READ_TIMEOUT:-60s}
    DWH_RATE_LIMIT_PUBLIC_READ_PER_MINUTE: ${DWH_RATE_LIMIT_PUBLIC_READ_PER_MINUTE:-600}
    DWH_TYPESENSE_URL: http://typesense:8108
    DWH_TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}
    DWH_TYPESENSE_ENABLED: ${DWH_TYPESENSE_ENABLED:-true}
    MANAGEMENT_PORT: 9090
    TZ: UTC
  networks: [backend]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  # JNA extracts Argon2's native library at startup. Keep generic /tmp noexec,
  # but provide one private executable tmpfs for that library only.
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=1024m
    - /opt/smartupcms/jna:rw,nosuid,nodev,exec,size=16m,uid=10001,gid=10001,mode=0700
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 1536M
      reservations:
        memory: 512M
  logging:
    driver: json-file
    options: {max-size: "50m", max-file: "5"}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/smartupcms}/postgres:${APP_VERSION:?APP_VERSION must be an immutable release tag}}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smartupcms}
      DWH_DB_NAME: ${DWH_DB_NAME:-smartupcms_dwh}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      MIGRATE_DB_USER: ${MIGRATE_DB_USER:-smartupcms_migrator}
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
      APP_DB_USER: ${DB_USER:-smartupcms}
      APP_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      BACKUP_DB_USER: ${BACKUP_DB_USER:-smartupcms_backup}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${DB_NAME:-smartupcms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 1m
    shm_size: 256mb
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

  migrate:
    <<: *server-common
    profiles: [tools]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-smartupcms}
      DB_USER: ${MIGRATE_DB_USER:-smartupcms_migrator}
      DB_PASSWORD: ${MIGRATE_DB_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
      APP_DWH_URL: jdbc:postgresql://postgres:5432/${DWH_DB_NAME:-smartupcms_dwh}
      APP_DWH_USERNAME: ${DB_USER:?DB_USER is required}
      APP_DWH_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      APP_DWH_CONNECT_TIMEOUT: ${APP_DWH_CONNECT_TIMEOUT:-5s}
      DWH_MIGRATE_SCOPE: dwh
      DWH_DATA_DB_URL: jdbc:postgresql://postgres:5432/${DWH_DB_NAME:-smartupcms_dwh}
      DWH_DATA_DB_USER: ${DB_USER:?DB_USER is required}
      DWH_DATA_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    # ADR-0001, two databases: MigrateMain applies db/dwh only (DWH_MIGRATE_SCOPE=dwh), then the regular migrate profile
    # applies db/migration as before (SPRING_FLYWAY_TARGET and other Flyway settings keep working).
    # DwhSchemaVersionGate checks pg-dwh on every Spring context start (the migrate profile included),
    # so db/dwh has to be applied before the first context start. All arguments are inline: nothing is lost in sh -c.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        java -cp app.jar com.greenwhite.dwh.instance.fnd.migration.MigrateMain
        && exec java -jar app.jar --spring.profiles.active=migrate
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  server:
    <<: *server-common
    networks: [frontend, backend]
    volumes:
      - server-data:/var/lib/smartupcms
      - backup-status:/var/lib/smartupcms/backup:ro
    depends_on:
      postgres: {condition: service_healthy}
      typesense: {condition: service_healthy}
      clamav: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 60s
    stop_grace_period: 30s

  web:
    image: ${WEB_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/smartupcms}/web:${APP_VERSION:?APP_VERSION must be an immutable release tag}}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    networks: [frontend]
    depends_on:
      server: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /var/lib/nginx/tmp:rw,nosuid,nodev,noexec,uid=10001,gid=10001,mode=0700
      - /run/nginx:rw,nosuid,nodev,noexec,uid=10001,gid=10001,mode=0750
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

  typesense:
    image: ${TYPESENSE_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/smartupcms}/typesense:${APP_VERSION:?APP_VERSION must be an immutable release tag}}
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "false"
    volumes:
      - typesense-data:/data
    networks: [backend]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec "exec 3<>/dev/tcp/127.0.0.1/8108;
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '\"ok\":true' <&3"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

  clamav:
    # Official multi-architecture image, pinned to both a security-patched
    # release and its immutable OCI index digest.
    image: ${CLAMAV_IMAGE:-clamav/clamav-debian:1.5.3@sha256:741e6c447241220e0792a901befcaec1d55a755c5097fc9cd88d7fd8be251a5c}
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          memory: 1024M
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

  backup-bootstrap:
    image: ${BACKUP_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/smartupcms}/backup:${APP_VERSION:?APP_VERSION must be an immutable release tag}}
    profiles: [tools]
    restart: "no"
    entrypoint: ["/usr/local/bin/bootstrap-role"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-smartupcms}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD_FILE: /run/secrets/postgres_password
      MIGRATE_DB_USER: ${MIGRATE_DB_USER:-smartupcms_migrator}
      MIGRATE_DB_PASSWORD_FILE: /run/secrets/migrate_database_password
      APP_DB_USER: ${DB_USER:-smartupcms}
      APP_DB_PASSWORD_FILE: /run/secrets/database_password
      BACKUP_DB_USER: ${BACKUP_DB_USER:-smartupcms_backup}
      BACKUP_DB_PASSWORD_FILE: /run/secrets/backup_database_password
    secrets:
      - postgres_password
      - migrate_database_password
      - database_password
      - backup_database_password
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  backup:
    image: ${BACKUP_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/smartupcms}/backup:${APP_VERSION:?APP_VERSION must be an immutable release tag}}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-smartupcms}
      PGUSER: ${BACKUP_DB_USER:-smartupcms_backup}
      PGPASSWORD_FILE: /run/secrets/backup_database_password
      AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_STORAGE_MODE: ${BACKUP_STORAGE_MODE:-local}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups}
      BACKUP_S3_ACCESS_KEY_ID_FILE: /run/secrets/backup_s3_access_key_id
      BACKUP_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/backup_s3_secret_access_key
    secrets:
      - backup_database_password
      - backup_s3_access_key_id
      - backup_s3_secret_access_key
    volumes:
      - backups:/backups
      - backup-status:/status
    networks: [backend, egress]
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-${DB_PASSWORD_FILE:?DB_PASSWORD_FILE is required}}
  migrate_database_password:
    file: ${MIGRATE_DB_PASSWORD_FILE:-${DB_PASSWORD_FILE:?DB_PASSWORD_FILE is required}}
  database_password:
    file: ${DB_PASSWORD_FILE:?DB_PASSWORD_FILE is required}
  backup_database_password:
    file: ${BACKUP_DB_PASSWORD_FILE:?BACKUP_DB_PASSWORD_FILE is required}
  backup_s3_access_key_id:
    file: ${BACKUP_S3_ACCESS_KEY_ID_FILE:-${BACKUP_DB_PASSWORD_FILE:?BACKUP_DB_PASSWORD_FILE is required}}
  backup_s3_secret_access_key:
    file: ${BACKUP_S3_SECRET_ACCESS_KEY_FILE:-${BACKUP_DB_PASSWORD_FILE:?BACKUP_DB_PASSWORD_FILE is required}}

volumes:
  postgres-data:
  server-data:
  typesense-data:
  clamav-data:
  backups:
  backup-status:
