name: ${PROJECT_NAME:-smartupcms}

x-server-environment: &server-environment
  JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1024m -XX:+ExitOnOutOfMemoryError -XX:+UseZGC -Djava.security.egd=file:/dev/./urandom -Duser.timezone=UTC"
  DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-smartupcms}
  DB_USER: ${DB_USER:-smartupcms}
  DB_PASSWORD: ${DB_PASSWORD:-smartupcms_local_dev}
  APP_DWH_URL: jdbc:postgresql://postgres:5432/${DWH_DB_NAME:-smartupcms_dwh}
  APP_DWH_USERNAME: ${DB_USER:-smartupcms}
  APP_DWH_PASSWORD: ${DB_PASSWORD:-smartupcms_local_dev}
  APP_DWH_CONNECT_TIMEOUT: ${APP_DWH_CONNECT_TIMEOUT:-5s}
  DWH_INSTANCE_CLIENT_CODE: ${ORGANIZATION_CODE:-local}
  DWH_INSTANCE_CLIENT_NAME: ${ORGANIZATION_NAME:-Local Organization}
  DWH_INSTANCE_RESOURCE_PROFILE: ${RESOURCE_PROFILE:-S}
  DWH_INSTANCE_ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
  DWH_INSTANCE_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
  DWH_INSTANCE_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-DevOnly-ChangeMe-1}
  DWH_PROVIDER_STORAGE: ${DWH_PROVIDER_STORAGE:-local_disk}
  DWH_STORAGE_LOCAL_PATH: /var/lib/smartupcms/storage
  DWH_BACKUP_STATUS_FILE: /var/lib/smartupcms/backup/status.json
  DWH_SYSTEM_HEALTH_TIMEOUT: ${DWH_SYSTEM_HEALTH_TIMEOUT:-2s}
  DWH_BACKUP_MAX_AGE: ${DWH_BACKUP_MAX_AGE:-0s}
  DWH_WEBHOOKS_ENABLED: ${DWH_WEBHOOKS_ENABLED:-false}
  DWH_WEBHOOKS_ALLOWED_HOSTS: ${DWH_WEBHOOKS_ALLOWED_HOSTS:-}
  DWH_WEBHOOKS_ALLOW_PRIVATE_ADDRESSES: ${DWH_WEBHOOKS_ALLOW_PRIVATE_ADDRESSES:-false}
  DWH_WEBHOOKS_CONNECT_TIMEOUT: ${DWH_WEBHOOKS_CONNECT_TIMEOUT:-3s}
  DWH_WEBHOOKS_READ_TIMEOUT: ${DWH_WEBHOOKS_READ_TIMEOUT:-10s}
  DWH_S3_ENDPOINT: ${DWH_S3_ENDPOINT:-}
  DWH_S3_REGION: ${DWH_S3_REGION:-auto}
  DWH_S3_ACCESS_KEY: ${DWH_S3_ACCESS_KEY:-}
  DWH_S3_SECRET_KEY: ${DWH_S3_SECRET_KEY:-}
  DWH_S3_BUCKET: ${DWH_S3_BUCKET:-}
  DWH_S3_PATH_STYLE: ${DWH_S3_PATH_STYLE:-true}
  DWH_FILE_SCANNER_REQUIRED: ${DWH_FILE_SCANNER_REQUIRED:-false}
  DWH_FILE_SCANNER_CLAMAV_ENABLED: ${DWH_FILE_SCANNER_CLAMAV_ENABLED:-false}
  DWH_FILE_SCANNER_CLAMAV_HOST: ${DWH_FILE_SCANNER_CLAMAV_HOST:-clamav}
  DWH_FILE_SCANNER_CLAMAV_PORT: ${DWH_FILE_SCANNER_CLAMAV_PORT:-3310}
  DWH_FILE_SCANNER_CLAMAV_CONNECT_TIMEOUT: ${DWH_FILE_SCANNER_CLAMAV_CONNECT_TIMEOUT:-3s}
  DWH_FILE_SCANNER_CLAMAV_READ_TIMEOUT: ${DWH_FILE_SCANNER_CLAMAV_READ_TIMEOUT:-60s}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  DWH_MAIL_FROM: ${DWH_MAIL_FROM:-no-reply@localhost}
  DWH_MAIL_FROM_NAME: ${DWH_MAIL_FROM_NAME:-SmartupCMS}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  DWH_PROVIDER_MAIL: ${DWH_PROVIDER_MAIL:-console_mail}
  DWH_PROVIDER_SMS: ${DWH_PROVIDER_SMS:-console_sms}
  DWH_PROVIDER_MESSENGER: ${DWH_PROVIDER_MESSENGER:-console_messenger}
  DWH_TYPESENSE_URL: http://typesense:8108
  DWH_TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-smartupcms_typesense_local_dev}
  DWH_TYPESENSE_ENABLED: ${DWH_TYPESENSE_ENABLED:-true}
  MANAGEMENT_PORT: 9090
  TZ: UTC

services:
  postgres:
    build:
      context: deploy/images/postgres
      dockerfile: Dockerfile
    image: ${POSTGRES_IMAGE:-smartupcms/postgres:18-alpine-hardened}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smartupcms}
      DWH_DB_NAME: ${DWH_DB_NAME:-smartupcms_dwh}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-smartupcms_local_dev}}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      MIGRATE_DB_USER: ${MIGRATE_DB_USER:-smartupcms_migrator}
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:-${DB_PASSWORD:-smartupcms_local_dev}}
      APP_DB_USER: ${DB_USER:-smartupcms}
      APP_DB_PASSWORD: ${DB_PASSWORD:-smartupcms_local_dev}
      BACKUP_DB_USER: ${BACKUP_DB_USER:-smartupcms_backup}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-${DB_PASSWORD:-smartupcms_local_dev}}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${DB_NAME:-smartupcms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build: {context: .}
    image: ${IMAGE_REGISTRY:-smartupcms}/server:${APP_VERSION:-dev}
    profiles: [tools]
    restart: "no"
    # ADR-0001, two databases: MigrateMain applies db/dwh only (DWH_MIGRATE_SCOPE=dwh), then the regular migrate profile
    # applies db/migration as before (SPRING_FLYWAY_TARGET and other Flyway settings keep working).
    # DwhSchemaVersionGate checks pg-dwh on every Spring context start (the migrate profile included),
    # so db/dwh has to be applied before the first context start. All arguments are inline: nothing is lost in sh -c.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        java -cp app.jar com.greenwhite.dwh.instance.fnd.migration.MigrateMain
        && exec java -jar app.jar --spring.profiles.active=migrate
    environment:
      <<: *server-environment
      DB_USER: ${MIGRATE_DB_USER:-smartupcms_migrator}
      DB_PASSWORD: ${MIGRATE_DB_PASSWORD:-${DB_PASSWORD:-smartupcms_local_dev}}
      DWH_MIGRATE_SCOPE: dwh
      DWH_DATA_DB_URL: jdbc:postgresql://postgres:5432/${DWH_DB_NAME:-smartupcms_dwh}
      DWH_DATA_DB_USER: ${DB_USER:-smartupcms}
      DWH_DATA_DB_PASSWORD: ${DB_PASSWORD:-smartupcms_local_dev}
    depends_on:
      postgres: {condition: service_healthy}

  server:
    build: {context: .}
    image: ${IMAGE_REGISTRY:-smartupcms}/server:${APP_VERSION:-dev}
    restart: unless-stopped
    command: ["--spring.profiles.active=${SPRING_PROFILE:-dev}"]
    environment: *server-environment
    volumes:
      - server-data:/var/lib/smartupcms
      - backup-status:/var/lib/smartupcms/backup:ro
    depends_on:
      postgres: {condition: service_healthy}
      typesense: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 60s

  web:
    build: {context: ./apps/web}
    image: ${IMAGE_REGISTRY:-smartupcms}/web:${APP_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4200}:8080"
      - "4201:8080"
    depends_on:
      server: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s

  typesense:
    build:
      context: .
      dockerfile: deploy/images/typesense/Dockerfile
    image: ${TYPESENSE_IMAGE:-smartupcms/typesense:27.1-hardened}
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-smartupcms_typesense_local_dev}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "false"
    ports:
      - "${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - typesense-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec "exec 3<>/dev/tcp/127.0.0.1/8108;
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '\"ok\":true' <&3"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  backup-bootstrap:
    build:
      context: ./deploy/images/backup
    image: ${IMAGE_REGISTRY:-smartupcms}/backup:${APP_VERSION:-dev}
    profiles: [tools]
    restart: "no"
    entrypoint: ["/usr/local/bin/bootstrap-role"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-smartupcms}
      PGUSER: ${DB_USER:-smartupcms}
      PGPASSWORD_FILE: /run/secrets/database_password
      BACKUP_DB_USER: ${BACKUP_DB_USER:-smartupcms_backup}
      BACKUP_DB_PASSWORD_FILE: /run/secrets/backup_database_password
    secrets: [database_password, backup_database_password]
    depends_on:
      postgres: {condition: service_healthy}

  backup:
    build:
      context: ./deploy/images/backup
    image: ${IMAGE_REGISTRY:-smartupcms}/backup:${APP_VERSION:-dev}
    profiles: [backup]
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-smartupcms}
      PGUSER: ${BACKUP_DB_USER:-smartupcms_backup}
      PGPASSWORD_FILE: /run/secrets/backup_database_password
      AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_STORAGE_MODE: ${BACKUP_STORAGE_MODE:-local}
    secrets: [backup_database_password]
    volumes:
      - backups:/backups
      - backup-status:/status
    depends_on:
      postgres: {condition: service_healthy}

secrets:
  database_password:
    file: ${DB_PASSWORD_FILE:-deploy/compose/.secrets/database-password}
  backup_database_password:
    file: ${BACKUP_DB_PASSWORD_FILE:-deploy/compose/.secrets/backup-database-password}

volumes:
  postgres-data:
  server-data:
  typesense-data:
  backups:
  backup-status:
